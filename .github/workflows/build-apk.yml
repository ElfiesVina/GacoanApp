name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

        - name: Siapkan kunci rilis
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace

    - name: Rename APK
      run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/TitipGacoan.apk

    - name: Cek tanda tangan
      run: |
        APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
        $APKSIGNER verify --print-certs android/app/build/outputs/apk/release/TitipGacoan.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TitipGacoan-APK
        path: android/app/build/outputs/apk/release/TitipGacoan.apk
        retention-days: 30
